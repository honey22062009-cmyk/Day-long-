name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o godot-editor.zip
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -o godot-templates.tpz
          mkdir -p godot-bin
          unzip -q godot-editor.zip -d godot-bin
          GODOT_PATH="$(find godot-bin -maxdepth 2 -type f -name 'Godot_*_linux.x86_64' | head -n 1)"
          test -n "$GODOT_PATH"
          chmod +x "$GODOT_PATH"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$GODOT_PATH" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-template-files
          unzip -q godot-templates.tpz -d /tmp/godot-template-files
          cp -a /tmp/godot-template-files/templates/. "$TEMPLATE_DIR/"

      - name: Import and validate project
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/day-long-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export installable debug APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/day-long-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/DayLongAddict-debug.apk
          test -s build/DayLongAddict-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Day-Long-Addict-Android-APK
          path: build/DayLongAddict-debug.apk
          if-no-files-found: error
          retention-days: 14
